<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <!-- Command: $ whoami -->
    <clipPath id="cp1">
      <rect x="20" y="52" width="0" height="25">
        <animate attributeName="width" from="0" to="90" dur="0.4s" begin="0.5s" fill="freeze" />
      </rect>
    </clipPath>
    
    <!-- Output: Abu Bakar... -->
    <clipPath id="cp2">
      <rect x="20" y="76" width="0" height="25">
        <animate attributeName="width" from="0" to="500" dur="0.01s" begin="1.1s" fill="freeze" />
      </rect>
    </clipPath>
    
    <!-- Command: $ cat mission.txt -->
    <clipPath id="cp3">
      <rect x="20" y="110" width="0" height="25">
        <animate attributeName="width" from="0" to="170" dur="0.6s" begin="1.6s" fill="freeze" />
      </rect>
    </clipPath>
    
    <!-- Output: Build software... -->
    <clipPath id="cp4">
      <rect x="20" y="134" width="0" height="25">
        <animate attributeName="width" from="0" to="600" dur="0.01s" begin="2.4s" fill="freeze" />
      </rect>
    </clipPath>
    
    <!-- Command: $ ls focus/ -->
    <clipPath id="cp5">
      <rect x="20" y="168" width="0" height="25">
        <animate attributeName="width" from="0" to="110" dur="0.5s" begin="2.9s" fill="freeze" />
      </rect>
    </clipPath>
    
    <!-- Output: focus dirs -->
    <clipPath id="cp6">
      <rect x="20" y="192" width="0" height="25">
        <animate attributeName="width" from="0" to="600" dur="0.01s" begin="3.6s" fill="freeze" />
      </rect>
    </clipPath>
    
    <!-- Command: $ ls exploring/ -->
    <clipPath id="cp7">
      <rect x="20" y="226" width="0" height="25">
        <animate attributeName="width" from="0" to="150" dur="0.6s" begin="4.1s" fill="freeze" />
      </rect>
    </clipPath>
    
    <!-- Output: exploring dirs -->
    <clipPath id="cp8">
      <rect x="20" y="250" width="0" height="25">
        <animate attributeName="width" from="0" to="500" dur="0.01s" begin="4.9s" fill="freeze" />
      </rect>
    </clipPath>
    
    <!-- Command: $ echo $STATUS -->
    <clipPath id="cp9">
      <rect x="20" y="284" width="0" height="25">
        <animate attributeName="width" from="0" to="140" dur="0.6s" begin="5.4s" fill="freeze" />
      </rect>
    </clipPath>
    
    <!-- Output: Open to SWE... -->
    <clipPath id="cp10">
      <rect x="20" y="308" width="0" height="25">
        <animate attributeName="width" from="0" to="600" dur="0.01s" begin="6.2s" fill="freeze" />
      </rect>
    </clipPath>
  </defs>

  <!-- Background Window -->
  <rect width="900" height="360" rx="12" fill="#0d1117"/>
  <rect width="900" height="36" rx="12" fill="#161b22"/>
  <rect y="24" width="900" height="12" fill="#161b22"/>
  
  <!-- Window Controls -->
  <circle cx="24" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="46" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="68" cy="18" r="6" fill="#27c93f"/>
  <text x="450" y="23" font-size="13" fill="#8b949e" text-anchor="middle">abubakar@comsats:~</text>

  <!-- Content Lines -->
  <text clip-path="url(#cp1)" x="24" y="70" font-size="15" fill="#58a6ff">$ whoami</text>
  <text clip-path="url(#cp2)" x="24" y="94" font-size="15" fill="#c9d1d9">Abu Bakar — BSCS @ COMSATS University, Islamabad</text>

  <text clip-path="url(#cp3)" x="24" y="128" font-size="15" fill="#58a6ff">$ cat mission.txt</text>
  <text clip-path="url(#cp4)" x="24" y="152" font-size="15" fill="#c9d1d9">Build software that ships, works, and genuinely helps people.</text>

  <text clip-path="url(#cp5)" x="24" y="186" font-size="15" fill="#58a6ff">$ ls focus/</text>
  <g clip-path="url(#cp6)">
    <text x="24" y="210" font-size="15" fill="#7ee787">deep-learning/</text>
    <text x="200" y="210" font-size="15" fill="#7ee787">computer-vision/</text>
    <text x="420" y="210" font-size="15" fill="#7ee787">system-design/</text>
  </g>

  <text clip-path="url(#cp7)" x="24" y="244" font-size="15" fill="#58a6ff">$ ls exploring/</text>
  <g clip-path="url(#cp8)">
    <text x="24" y="268" font-size="15" fill="#d2a8ff">production-ai-systems/</text>
    <text x="280" y="268" font-size="15" fill="#d2a8ff">distributed-systems/</text>
  </g>

  <text clip-path="url(#cp9)" x="24" y="302" font-size="15" fill="#58a6ff">$ echo $STATUS</text>
  <text clip-path="url(#cp10)" x="24" y="326" font-size="15" fill="#f0883e">Open to SWE / AI-ML internship &amp; new-grad opportunities</text>

  <!-- Blinking Cursor -->
  <text x="855" y="326" font-size="15" fill="#8b949e" opacity="0">
    _
    <animate attributeName="opacity" values="1;0;1" dur="1s" begin="6.5s" repeatCount="indefinite" />
  </text>
</svg>
